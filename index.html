<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Relisha Pereira · Rotary link directory.">
  <title>Relisha Pereira · Rotary Directory</title>
  <style>
    :root { color-scheme: light; --paper:#fff; --ink:#800020; --accent-pink:#FFB6D9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,sans-serif; }
    main { width:min(100%,680px); margin:auto; padding:40px 20px 50px; }
    .dial { width:100%; aspect-ratio:1; position:relative; isolation:isolate; overflow:visible; margin-bottom:34px; }
    .mechanism { position:absolute; inset:0; border-radius:50%; background:#800020; border:6px solid #FFB6D9; box-shadow:inset 0 0 20px rgba(0,0,0,0.2),0 9px 18px rgba(255,182,217,0.3); }
    .connection { position:absolute; left:var(--x); top:var(--y); width:60px; height:60px; border-radius:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--accent); background:radial-gradient(circle at 35% 25%,#B0E0E6 0%,#87CEEB 40%,#4A90E2 80%); border:4px solid #FFB6D9; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.5),inset 2px 2px 4px rgba(0,0,0,0.2),inset -2px -2px 4px rgba(255,255,255,0.3),0 4px 8px rgba(255,182,217,0.3); text-decoration:none; font-weight:700; -webkit-tap-highlight-color:transparent; z-index:10; cursor:pointer; }
    .connection .emoji { font-size:24px; }
    .connection .label { font-size:7px; font-weight:700; color:#800020; line-height:1; font-family:'Brush Script MT','Lucida Handwriting',cursive; }
    .connection img { width:55%; height:55%; object-fit:contain; }
    .connection[aria-disabled] { cursor:default; }
    .connection.is-selected { outline:3px solid var(--accent); outline-offset:5px; }
    a:focus-visible, button:focus-visible { outline:3px solid #216dca; outline-offset:6px; }
    .center { position:absolute; inset:27%; border-radius:50%; background:radial-gradient(circle at 35% 20%,#B0E0E6,#87CEEB); border:3px solid #FFB6D9; box-shadow:none; pointer-events:none; }
    .arch { position:absolute; inset:0; width:100%; height:100%; font:700 11px 'Brush Script MT','Lucida Handwriting',cursive; letter-spacing:1.2px; fill:#800020; stroke:#000; stroke-width:0.5px; }
    h1 { position:absolute; inset:26% 6% 12%; margin:0; display:flex; flex-direction:column; justify-content:center; align-items:center; font-family:'Brush Script MT','Lucida Handwriting',cursive; font-style:italic; font-size:clamp(19px,5.5vw,38px); line-height:1.1; text-align:center; color:#800020; font-weight:700; -webkit-text-stroke:1px #000; text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000; }
    .stop { position:absolute; left:87%; top:55%; width:9%; height:19%; border-radius:55% 25% 15% 15%; transform:rotate(-30deg); background:linear-gradient(92deg,#3f484d,#f7fbfb 28%,#b9c4cb 48%,#fff 67%,#4e5659); border:1px solid #697076; box-shadow:3px 5px 5px #0006,inset 0 0 0 2px #ffffffa8; pointer-events:none; }
    .link-directory { width:max-content; max-width:100%; margin:0 auto; }
    .link-directory a, .pending { display:flex; gap:24px; align-items:center; justify-content:space-between; padding:9px 0; min-height:44px; text-decoration:none; color:inherit; font:600 clamp(16px,2.9vw,19px)/1.35 'Gill Sans','Gill Sans MT',Arial,sans-serif; text-transform:uppercase; letter-spacing:.04em; }
    .link-directory a:hover .label { text-decoration:underline; text-underline-offset:4px; }
    .link-directory li { list-style:none; }
    .link-directory ul { margin:0; padding:0; }
    .label { overflow-wrap:anywhere; }
    .arrow { flex-shrink:0; font-family:Arial,sans-serif; font-size:23px; font-weight:400; }
    .pending { color:#646563; }
    .pending small { font-size:10px; letter-spacing:0; white-space:nowrap; text-transform:none; }
    .controls { text-align:center; margin:24px 0 0; }
    button { min-height:44px; padding:10px 18px; color:inherit; border:1px solid #999b95; background:transparent; border-radius:30px; cursor:pointer; font:13px Arial,sans-serif; }
    .setup-note { max-width:420px; margin:25px auto 0; font-size:13px; line-height:1.5; text-align:center; color:#565955; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:480px) { main { padding:26px 20px 32px; } .dial { margin-bottom:30px; } }
  </style>
</head>
<body>
  <main>
    <div class="dial" aria-label="Rotary links">
      <div class="mechanism">
        <a href="https://www.instagram.com/relisha_pereira_28" class="connection" style="--x:73%; --y:25%; --accent:#800020;"><span class="emoji">📸</span><span class="label">Instagram</span></a>
        <a href="https://instagram.com/askgisselle" class="connection" style="--x:50%; --y:11%; --accent:#800020;"><span class="emoji">🎙️</span><span class="label">Podcast</span></a>
        <a href="https://a.co/d/056rr3AH" class="connection" style="--x:24%; --y:21%; --accent:#800020;"><span class="emoji">🛍️</span><span class="label">Amazon</span></a>
        <a href="https://pin.it/15CGPyyHj" class="connection" style="--x:10%; --y:46%; --accent:#800020;"><span class="emoji">📌</span><span class="label">Pinterest</span></a>
        <a href="https://linktr.ee/Relisha28" class="connection" style="--x:18%; --y:73%; --accent:#800020;"><span class="emoji">🌳</span><span class="label">Links</span></a>
        <span class="connection" style="--x:57%; --y:88%; --accent:#800020;" aria-disabled="true"><span class="emoji">📚</span><span class="label">Courses</span></span>
        <span class="connection" style="--x:70%; --y:16%; --accent:#800020;" aria-disabled="true"><span class="emoji">⭐</span><span class="label">Coming</span></span>
      </div>
      <div class="center">
        <svg class="arch" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <path id="name-arch-top" d="M 31 93 A 70 70 0 0 1 169 93"/>
            <path id="name-arch-bottom" d="M 169 107 A 70 70 0 0 1 31 107"/>
          </defs>
          <text text-anchor="middle"><textPath href="#name-arch-top" startOffset="50%">HELLO BEAUTIFUL</textPath></text>
          <text text-anchor="middle"><textPath href="#name-arch-bottom" startOffset="50%">FOLLOW MY JOURNEY</textPath></text>
        </svg>
        <h1>✨💄🌸<br>Glow<br>💋✨🌸</h1>
      </div>
      <div class="stop" aria-hidden="true"></div>
    </div>
    <nav class="link-directory" aria-label="My links"><ul></ul></nav>
    <div class="controls"><button class="motion-toggle" type="button" aria-pressed="false">Pause rotation</button></div>
    <p class="setup-note" hidden></p>
    <p id="dial-status" class="sr-only" aria-live="polite"></p>
    <p id="debug-rotation" style="text-align:center; font-size:14px; color:#666; margin-top:20px;"></p>
    <noscript>This directory needs JavaScript to load its configured links. Please enable JavaScript.</noscript>
  </main>
  <script>
    const mechanism = document.querySelector('.mechanism');
    const toggle = document.querySelector('.motion-toggle');
    const debugDisplay = document.querySelector('#debug-rotation');

    let paused = false;
    let rotation = 0;
    let startTime = Date.now();
    let frameCount = 0;

    function updateToggle() {
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.textContent = paused ? 'Resume rotation' : 'Pause rotation';
    }

    toggle.addEventListener('click', () => {
      paused = !paused;
      if (!paused) {
        startTime = Date.now() - (rotation * 50000 / 360);
      }
      updateToggle();
    });

    function animate() {
      frameCount++;
      if (!paused && mechanism) {
        const elapsed = Date.now() - startTime;
        rotation = (elapsed * 360 / 50000) % 360;
        mechanism.style.transform = `rotate(${rotation}deg)`;
      }
      if (frameCount % 30 === 0 && debugDisplay) {
        debugDisplay.textContent = `Rotation: ${rotation.toFixed(0)}° | Status: ${paused ? 'paused' : 'rotating'}`;
      }
      requestAnimationFrame(animate);
    }

    updateToggle();
    animate();
  </script>
</body>
</html>
